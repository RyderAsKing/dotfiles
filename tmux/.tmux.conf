# ------------------------------------------------------------
# Prefix
# ------------------------------------------------------------

set -g prefix C-s
unbind C-b
bind C-s send-prefix


# ------------------------------------------------------------
# Terminal + UX
# ------------------------------------------------------------

set -g mouse on
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u

# Advertise true colour only for xterm-compatible outer terminals.
set -as terminal-features ",xterm*:RGB"

set -g base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Keep OSC 52 off; under WSL, pipe copies to the Windows clipboard instead.
set -s set-clipboard off
if-shell -b 'command -v clip.exe >/dev/null 2>&1' {
  set -s copy-command "clip.exe"
}

# Use the dimensions of the most recently active client.
# Helps when attaching from terminals with different sizes.
set -g window-size latest


# ------------------------------------------------------------
# Status bar
# ------------------------------------------------------------

set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 150


# ------------------------------------------------------------
# Plugins
# ------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.3'


# ------------------------------------------------------------
# Catppuccin
# ------------------------------------------------------------

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'


# ------------------------------------------------------------
# Status content
# ------------------------------------------------------------

set -g status-left '#{?client_prefix,[PREFIX] ,}#{?pane_in_mode,[COPY] ,}'

set -g window-status-format '#I:#W#F'
set -g window-status-current-format '#[bold]#I:#W#F'

set -g status-right '#{?window_zoomed_flag,[ZOOM] ,}'
set -ag status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_uptime}'


# ------------------------------------------------------------
# Window navigation
# ------------------------------------------------------------

bind H previous-window
bind L next-window
bind ^A last-window


# ------------------------------------------------------------
# Splits
# ------------------------------------------------------------

unbind '"'
unbind %

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"


# ------------------------------------------------------------
# Pane navigation
# ------------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind c select-pane -t :.+


# ------------------------------------------------------------
# Pane resizing
# ------------------------------------------------------------

bind -r , resize-pane -L 20
bind -r . resize-pane -R 20
bind -r - resize-pane -D 7
bind -r = resize-pane -U 7


# ------------------------------------------------------------
# Rename
# ------------------------------------------------------------

bind r command-prompt -I "#W" "rename-window '%%'"
bind % command-prompt -I "#S" "rename-session '%%'"


# ------------------------------------------------------------
# Session manager
# ------------------------------------------------------------

bind S choose-tree -Zs


# ------------------------------------------------------------
# Miscellaneous
# ------------------------------------------------------------

bind n new-window -c "#{pane_current_path}"
bind N new-session

bind & kill-window
bind z resize-pane -Z
bind x kill-pane
bind X swap-pane -D

bind w list-windows
bind '"' choose-window
bind : command-prompt

bind K send-keys "clear" \; send-keys Enter


# ------------------------------------------------------------
# Synchronize panes
# ------------------------------------------------------------

bind * setw synchronize-panes


# ------------------------------------------------------------
# Reload config
# ------------------------------------------------------------

bind R source-file ~/.tmux.conf \; display-message "Config reloaded"


# ------------------------------------------------------------
# Copy mode
# Yank / mouse drag use copy-pipe so copy-command (clip.exe) is applied.
# ------------------------------------------------------------

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel


# ------------------------------------------------------------
# TPM runtime
# Keep this as the final line.
# ------------------------------------------------------------

run ~/.tmux/plugins/tpm/tpm

set -sg escape-time 500
